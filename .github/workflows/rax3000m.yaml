name: Build RAX3000M NAND

on:
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 390
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            autoconf automake autopoint binutils bison build-essential bzip2 ccache \
            clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib \
            gettext git intltool libelf-dev libncurses-dev libreadline-dev libssl-dev \
            libtool patch pkgconf python3 python3-ply qemu-utils re2c rsync squashfs-tools \
            unzip wget xxd zlib1g-dev

      - name: Clone source
        run: |
          git clone --depth=1 --filter=blob:none \
            -b openwrt-24.10-6.6 \
            https://github.com/padavanonly/immortalwrt-mt798x-6.6 openwrt

      - name: Update & install feeds
        working-directory: openwrt
        run: |
          echo "src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main" >> feeds.conf.default
          echo "src-git openlist2 https://github.com/sbwml/luci-app-openlist2.git" >> feeds.conf.default
          ./scripts/feeds update -a
          rm -rf feeds/packages/lang/golang
          git clone https://github.com/sbwml/packages_lang_golang -b 26.x feeds/packages/lang/golang
          ./scripts/feeds install -a

      - name: Apply device config
        working-directory: openwrt
        run: |
          cp -f $GITHUB_WORKSPACE/upstream_mt7981-ax3000.config .config

          for p in \
            luci-i18n-base-zh-cn curl \
            kmod-usb-net kmod-usb-net-rndis kmod-usb-net-cdc-ncm kmod-usb-net-cdc-ether usbutils \
            nikki luci-app-nikki luci-i18n-nikki-zh-cn \
            openlist2 luci-app-openlist2 luci-i18n-openlist2-zh-cn; do
            printf 'CONFIG_PACKAGE_%s=y\n' "$p" >> .config
          done

          make defconfig

          for p in nikki luci-app-openlist2 luci-i18n-base-zh-cn curl; do
            grep -q "^CONFIG_PACKAGE_${p}=y" .config || { echo "MISSING: $p"; exit 1; }
          done
          echo "PACKAGES_OK"

      - name: Build firmware
        working-directory: openwrt
        run: make -j$(nproc) || make -j1 V=s

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp openwrt/bin/targets/mediatek/*/*cmcc_rax3000m* artifacts/ 2>/dev/null || true
          cp openwrt/bin/targets/mediatek/*/*.buildinfo artifacts/ 2>/dev/null || true
          (cd artifacts && sha256sum * > sha256sums.txt 2>/dev/null || true)
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rax3000m-nand-6.6
          path: artifacts/
          retention-days: 90
          if-no-files-found: warn
