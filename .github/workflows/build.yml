name: Build RAX3000M eMMC (padavanonly 6.6 closed mt_wifi)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 390
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h / | tail -1

      - name: Checkout (build scripts/config)
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler fastjar flex gawk \
            gcc-multilib g++-multilib gettext git intltool libelf-dev libncurses-dev \
            libreadline-dev libssl-dev libtool lrzsz mkisofs patch pkgconf python3 \
            python3-ply python3-docutils qemu-utils re2c rsync squashfs-tools subversion \
            swig texinfo unzip upx-ucl wget xxd zlib1g-dev
          sudo apt-get -y -qq autoremove

      - name: Clone padavanonly source (openwrt-24.10-6.6)
        run: |
          git clone --depth=1 --filter=blob:none \
            -b openwrt-24.10-6.6 \
            https://github.com/padavanonly/immortalwrt-mt798x-6.6 openwrt
          ls openwrt | head

      - name: Update & install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply device config (upstream mt7981-ax3000 + enable eMMC MTK device + user packages)
        working-directory: openwrt
        run: |
          cp -f $GITHUB_WORKSPACE/upstream_mt7981-ax3000.config .config
          # 真实设备名(上游 defconfig 里的是过时的 cmcc_rax3000m-emmc):
          printf 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-emmc-mtk=y\n' >> .config
          # 用户选定内置包(不含 luci-app-upnp;SQM 因源缺 tc 不可编):
          for p in luci-theme-argon luci-app-argon-config luci-app-watchcat luci-app-autoreboot curl; do
            printf 'CONFIG_PACKAGE_%s=y\n' "$p" >> .config
          done
          make defconfig
          echo "--- enabled cmcc_rax3000m devices ---"
          grep '^CONFIG_TARGET_DEVICE.*cmcc_rax3000m' .config
          echo "--- user packages enabled ---"
          for p in luci-theme-argon luci-app-argon-config luci-app-watchcat luci-app-autoreboot curl; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then echo "OK $p"; else echo "MISSING $p"; fi
          done
          grep -q '^CONFIG_PACKAGE_curl=y' .config && echo PACKAGES_OK || { echo PACKAGE_SET_FAIL; exit 1; }

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) || make -j1 V=s
          echo "--- cmcc_rax3000m images ---"
          find bin/targets/mediatek -maxdepth 2 -type f | grep cmcc_rax3000m | sort
          test -n "$(ls bin/targets/mediatek/*/*cmcc_rax3000m-emmc-mtk*squashfs-sysupgrade.bin 2>/dev/null)" && echo FOUND_EMMC_TAR || (echo NO_EMMC_MTK_TAR; exit 1)

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp openwrt/bin/targets/mediatek/*/*cmcc_rax3000m* artifacts/ 2>/dev/null || true
          cp openwrt/bin/targets/mediatek/*/config.buildinfo openwrt/bin/targets/mediatek/*/version.buildinfo artifacts/ 2>/dev/null || true
          ls -la artifacts/
          (cd artifacts && sha256sum * > sha256sums.txt 2>/dev/null || true)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rax3000m-emmc-6.6-closed
          path: artifacts/
          retention-days: 90
          if-no-files-found: warn
